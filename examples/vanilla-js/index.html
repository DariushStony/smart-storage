<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>smart-storage demo</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button {
        margin: 0 0.5rem 0.5rem 0;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        overflow: auto;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111;
          color: #eee;
        }
        pre {
          background: #222;
        }
      }
    </style>
  </head>
  <body>
    <h1>smart-storage demo</h1>
    <p>
      Uses the built bundle. From the repo root run <code>pnpm build</code>,
      then <code>node tests/e2e/server.mjs</code>, and open
      <code>http://localhost:4173/examples/vanilla-js/index.html</code>.
    </p>

    <button id="set">set theme = dark</button>
    <button id="ttl">set token (5 s TTL)</button>
    <button id="extend">extend token +5 s</button>
    <button id="remove">remove theme</button>
    <button id="clear">clear</button>
    <button id="quota">try to exceed maxBytes</button>

    <pre id="out"></pre>

    <script type="module">
      import { createVault, StorageQuotaError } from '../../dist/index.js';

      const out = document.getElementById('out');
      const log = [];
      const vault = createVault({
        key: 'DEMO',
        maxBytes: 2_000,
        onError: (error) => log.push(`onError: ${error.code} ${error.message}`),
      });

      function render() {
        out.textContent = JSON.stringify(
          {
            items: vault.toObject(),
            tokenTtlMs: vault.ttl('token'),
            stats: vault.stats(),
            raw: localStorage.getItem('DEMO'),
            log: log.slice(-5),
          },
          null,
          2
        );
      }

      const actions = {
        set: () => vault.set('theme', 'dark'),
        ttl: () => vault.set('token', 'abc', { ttl: 5_000 }),
        extend: () => vault.extend('token', 5_000),
        remove: () => vault.remove('theme'),
        clear: () => vault.clear(),
        quota: () => {
          try {
            vault.set('big', 'x'.repeat(5_000));
          } catch (error) {
            if (error instanceof StorageQuotaError)
              log.push(`caught: ${error.message}`);
            else throw error;
          }
        },
      };

      for (const [id, action] of Object.entries(actions)) {
        document.getElementById(id).addEventListener('click', () => {
          action();
          render();
        });
      }

      setInterval(render, 500);
      render();
    </script>
  </body>
</html>
